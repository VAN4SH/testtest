<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты - ТехноДом</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container header-row">
      <h1 class="logo">ТехноДом</h1>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="product.html">Товар</a>
        <a href="about.html">О нас</a>
        <a href="contacts.html">Контакты</a>
      </nav>
      <div class="header-actions">
        <button id="themeToggle" class="small-btn" type="button">Тема</button>
        <div class="cart-box">Корзина: <span id="cartCount">0</span></div>
      </div>
    </div>
  </header>

  <main class="container section">
    <h2>Контакты</h2>
    <p>Телефон: +7 (900) 123-45-67</p>
    <p>Email: info@tehnodom.ru</p>

    <h3>Форма обратной связи</h3>
    <form id="contactForm" class="form">
      <label for="name">Имя</label>
      <input class="input" id="name" type="text" placeholder="Ваше имя">

      <label for="phone">Телефон</label>
      <input class="input" id="phone" type="text" placeholder="+7 (___) ___-__-__">

      <label for="message">Сообщение</label>
      <textarea class="input" id="message" rows="4" placeholder="Ваш вопрос"></textarea>

      <button class="main-btn" type="submit">Отправить</button>
      <p id="formMessage" class="form-message"></p>
    </form>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 ТехноДом</p>
    </div>
  </footer>
</body>
</html>
