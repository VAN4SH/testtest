<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар - ТехноДом</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container header-row">
      <h1 class="logo">ТехноДом</h1>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="product.html">Товар</a>
        <a href="about.html">О нас</a>
        <a href="contacts.html">Контакты</a>
      </nav>
      <div class="header-actions">
        <button id="themeToggle" class="small-btn" type="button">Тема</button>
        <div class="cart-box">Корзина: <span id="cartCount">0</span></div>
      </div>
    </div>
  </header>

  <main class="container section">

        <p>Удобный холодильник для семьи. Объём 300 л, тихая работа и экономичный режим.</p>
        <p class="price">39 900 ₽</p>
        <button class="main-btn add-to-cart" type="button">Добавить в корзину</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 ТехноДом</p>
    </div>
  </footer>
